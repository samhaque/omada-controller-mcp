[project]
name = "omada-controller-mcp"
version = "0.1.0"
description = "MCP server + typed Python SDK for a TP-Link Omada SDN controller's Open API"
readme = "README.md"
authors = [
    { name = "samhaque", email = "13789262+samhaque@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "fastmcp>=4.0.5",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
omada-mcp = "omada_mcp.server:main"

[tool.uv.build-backend]
module-name = ["omada_client", "omada_auth", "omada_mcp"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
