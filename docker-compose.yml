# Default here is .env + plain environment vars - simplest for a single
# home-lab deployment. For file-based secrets instead (Docker/K8s secrets,
# Vault agent), drop OMADA_CLIENT_ID/OMADA_CLIENT_SECRET below, add:
#
#   secrets:
#     omada_client_id: { file: ./secrets/omada_client_id }
#     omada_client_secret: { file: ./secrets/omada_client_secret }
#   services.omada-mcp.secrets: [omada_client_id, omada_client_secret]
#   services.omada-mcp.environment:
#     OMADA_CLIENT_ID_FILE: /run/secrets/omada_client_id
#     OMADA_CLIENT_SECRET_FILE: /run/secrets/omada_client_secret
#
# auth.py reads *_FILE the same way either path.
services:
  omada-mcp:
    image: samhaq/omada-controller-mcp:latest
    # Testing local changes instead of the published image: comment the
    # image line above, uncomment this, and run ./scripts/build_venv_for_docker.sh first.
    # build: .
    ports:
      - "8000:8000"
    environment:
      OMADA_BASE_URL: ${OMADA_BASE_URL:-https://your-controller.local:8043}
      OMADA_CLIENT_ID: ${OMADA_CLIENT_ID:?set OMADA_CLIENT_ID in .env}
      OMADA_CLIENT_SECRET: ${OMADA_CLIENT_SECRET:?set OMADA_CLIENT_SECRET in .env}
      OMADA_VERIFY_SSL: ${OMADA_VERIFY_SSL:-false}
      OMADA_MCP_AUTH_TOKEN: ${OMADA_MCP_AUTH_TOKEN:?set OMADA_MCP_AUTH_TOKEN in .env (openssl rand -hex 32) - this port is reachable from the whole LAN}
    restart: unless-stopped
