name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/omada-controller-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python tests/test_auth.py
      - run: uv run python tests/test_catalog.py

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv export --no-dev --no-emit-project --locked -o requirements.txt
      - run: uvx pip-audit -r requirements.txt

  build-venv:
    needs: [test, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: ./scripts/build_venv_for_docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: docker-deps
          include-hidden-files: true
          path: |
            .venv-docker
            openapi/controller-spec.json

  docker:
    needs: build-venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-deps
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:scan
          load: true

      # v0.36.0, SHA-pinned: trivy-action's tags were hijacked in March 2026
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
